<!doctype html>
<html lang="es" class="h-100" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Despensa - NutriAgenda</title>
  
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  <style>
    .pantry-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .pantry-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>

<body class="d-flex flex-column h-100">

  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
    <header class="mb-4">
      <div>
        <h3 class="float-md-start mb-0">NutriAgenda</h3>
        <app-menu current-page="pantry.html"></app-menu>
      </div>
    </header>

    <main class="px-3 flex-grow-1">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="mb-0">Mi Despensa</h1>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-info" id="btn-quick-scan-stock" title="Escanear código de barras para añadir a la despensa">
            <i class="bi bi-upc-scan"></i> Escanear para añadir
          </button>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStockModal">
            + Añadir Stock
          </button>
        </div>
      </div>

      <!-- Pestañas food / nonfood -->
      <ul class="nav nav-tabs mb-3" id="pantry-zone-tabs">
        <li class="nav-item">
          <button class="nav-link active" data-zone="food">🥦 Alimentos</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-zone="nonfood">🧴 No alimentarios</button>
        </li>
      </ul>

      <!-- Buscador -->
      <div class="input-group mb-4">
        <input type="text" id="pantry-search" class="form-control" placeholder="Buscar en mi despensa...">
        <button class="btn btn-outline-light" id="scan-pantry-btn"><i class="bi bi-upc-scan"></i> Escanear</button>
      </div>

      <!-- Lista de inventario -->
      <div class="row" id="pantry-list">
        <!-- Inyectado vía JS -->
      </div>
    </main>

  </div>

  <!-- Modal para Añadir Stock (Sustituto de escáner en este MVP) -->
  <div class="modal fade" id="addStockModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Añadir Stock</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="add-stock-form">
            <div class="mb-3">
              <label class="form-label">Producto</label>
              <div class="input-group mb-2">
                <input type="text" id="stock-product-search" class="form-control" placeholder="Buscar por nombre o código...">
                <button class="btn btn-outline-secondary" type="button" id="btn-scan-stock" title="Escanear código"><i class="bi bi-upc-scan"></i></button>
                <button class="btn btn-outline-secondary" type="button" id="btn-search-stock-product">Buscar</button>
              </div>
              <div id="stock-product-results" class="list-group mb-2" style="max-height: 180px; overflow-y: auto;"></div>
              
              <!-- Producto seleccionado / confirmado -->
              <div id="stock-product-selected-card" class="d-none alert alert-success py-2 px-3 mb-2 small d-flex justify-content-between align-items-center">
                <div class="me-2 text-truncate">
                  <div class="fw-bold text-truncate" id="stock-selected-name"></div>
                  <div class="text-white-50 small" id="stock-selected-details"></div>
                </div>
                <button type="button" class="btn btn-sm btn-outline-light py-0 px-2 flex-shrink-0" id="btn-clear-selected-stock" title="Cambiar producto">✕ Cambiar</button>
              </div>
              
              <input type="hidden" id="stock-product-selected">
            </div>

            <div class="row mb-3">
              <div class="col-8">
                <label class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="stock-amount" value="500" min="1">
              </div>
              <div class="col-4">
                <label class="form-label">Unidad</label>
                <select class="form-select" id="stock-unit">
                  <option value="g">g</option>
                  <option value="ml">ml</option>
                  <option value="unidad">ud</option>
                </select>
              </div>
              <div class="col-12 mt-2">
                <label class="form-label small text-muted">Unidades por paquete (opcional, para conversión en recetas)</label>
                <input type="number" class="form-control form-control-sm" id="stock-package-units" placeholder="Ej: 6 (huevos), 4 (yogures), 8 (salchichas)..." min="1" step="1">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-save-stock">Añadir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Consumir Stock Manualmente -->
  <div class="modal fade" id="consumeStockModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Retirar de Despensa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="consume-stock-form">
            <input type="hidden" id="consume-product-code">
            <div class="mb-3">
              <p><strong>Producto:</strong> <span id="consume-product-name"></span></p>
              <p><strong>Stock actual:</strong> <span id="consume-product-stock"></span></p>
            </div>
            <div class="mb-3">
              <label class="form-label">Motivo</label>
              <select class="form-select" id="consume-reason">
                <option value="consumed_family">Se lo ha comido alguien de la familia</option>
                <option value="trashed">Se ha tirado a la basura</option>
                <option value="expired">Ha caducado</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Cantidad a retirar</label>
              <input type="number" class="form-control" id="consume-amount" value="100" min="1">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btn-confirm-consume">Retirar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Detalles de Producto -->
  <div class="modal fade" id="productDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detail-product-name">Detalle del Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p><strong>Código:</strong> <span id="detail-product-code"></span></p>
          <p><strong>Stock en despensa:</strong> <span id="detail-product-stock"></span></p>
          <div id="detail-nutriscore-nova" class="mb-2"></div>
          
          <div id="detail-package-units-box" class="p-2 mb-3 rounded bg-dark border border-secondary">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="small fw-bold text-info">📦 Unidades por paquete:</span>
              <span id="detail-package-units-badge" class="badge bg-secondary">Sin definir</span>
            </div>
            <div class="input-group input-group-sm mb-1">
              <input type="number" class="form-control" id="detail-input-package-units" placeholder="Uds en el paquete (ej: 4, 6...)" min="1">
              <button class="btn btn-outline-info" type="button" id="btn-save-detail-package-units">Guardar</button>
            </div>
            <div class="small text-muted" id="detail-unit-weight-hint"></div>
          </div>
          
          <h6>Información Nutricional (por 100g/ml)</h6>
          <ul class="list-group list-group-flush mb-3" id="detail-nutrition-list">
            <!-- Rellenado por JS -->
          </ul>
          
          <h6>Historial de Movimientos</h6>
          <div class="list-group" id="detail-movements-list" style="max-height: 200px; overflow-y: auto;">
            <!-- Rellenado por JS -->
          </div>
          <div class="mt-3">
            <a id="detail-off-link" href="#" target="_blank" rel="noopener" class="btn btn-outline-success btn-sm w-100 d-none">
              🌍 Ver en OpenFoodFacts
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- Modal Mover Zona -->
  <div class="modal fade" id="moveZoneModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Mover zona</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-center">
          <input type="hidden" id="move-zone-product-code">
          <p class="mb-3"><strong id="move-zone-product-name"></strong></p>
          <div class="d-grid gap-2">
            <button class="btn btn-success" id="btn-move-to-food">🥦 Mover a Alimentos</button>
            <button class="btn btn-secondary" id="btn-move-to-nonfood">🧴 Mover a No alimentarios</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/pantry.js"></script>
</body>
</html>
