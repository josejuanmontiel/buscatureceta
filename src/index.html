<!DOCTYPE html>
<html lang="es" class="h-100" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriAgenda</title>
  <script src="./js/papaparse.min.js" type="text/javascript"></script>
  <script src="./js/pako_inflate.min.js"></script>
  <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>

<body class="d-flex h-100 text-center">

  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
    <header class="mb-auto">
      <div>
        <h3 class="float-md-start mb-0">NutriAgenda</h3>
        <app-menu current-page=""></app-menu>
      </div>
    </header>

    <main class="px-3 flex-grow-1 overflow-auto" id="app-view"></main>

    <footer class="mt-auto text-white-50">
    </footer>
  </div>

  <!-- Modal Detalle Rápido de Producto (compartido en toda la SPA) -->
  <div class="modal fade" id="quickDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="qd-product-name">Detalle del Producto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-2" id="qd-product-code"></p>
          <div id="qd-badges" class="mb-3"></div>
          <h6>Información Nutricional (por 100g/ml)</h6>
          <ul class="list-group list-group-flush mb-3" id="qd-nutrition"></ul>
          <a id="qd-off-link" href="#" target="_blank" rel="noopener" class="btn btn-outline-success btn-sm d-none">
            🌍 Ver en OpenFoodFacts
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
