<!doctype html>
<html lang="es" class="h-100" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recetas - NutriAgenda</title>
  
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  <style>
    /* Estilos extra para la vista de recetas */
    .recipe-card { cursor: pointer; transition: transform 0.2s; }
    .recipe-card:hover { transform: scale(1.02); }
    .nutrition-summary { font-size: 0.9em; color: #666; }
    .ingredient-list { max-height: 200px; overflow-y: auto; }
  </style>
</head>

<body class="d-flex flex-column h-100">

  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
    <header class="mb-4">
      <div>
        <h3 class="float-md-start mb-0">NutriAgenda</h3>
        <app-menu current-page="recipes.html"></app-menu>
      </div>
    </header>

    <main class="px-3 flex-grow-1">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1>Mis Recetas</h1>
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-outline-info" id="btn-open-mealie-import">
            🍽️ Importar de Mealie
          </button>
          <button class="btn btn-outline-success" id="btn-import-mediterranean-pack">
            🥗 Pack Mediterráneo
          </button>
          <button class="btn btn-primary" id="btn-new-recipe">
            + Añadir
          </button>
        </div>
      </div>

      <!-- Buscador -->
      <div class="input-group mb-4">
        <input type="text" id="recipe-search" class="form-control" placeholder="Buscar receta...">
      </div>

      <!-- Lista de recetas -->
      <div class="row" id="recipes-list">
        <!-- Las recetas se inyectan aquí vía JS -->
      </div>
    </main>

  </div>

  <!-- Modal para Importar desde Mealie -->
  <div class="modal fade" id="mealieImportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">🍽️ Importar Recetas desde Mealie</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="input-group mb-3">
            <input type="text" id="mealie-recipe-search" class="form-control" placeholder="Buscar en Mealie...">
            <button class="btn btn-outline-info" type="button" id="btn-refresh-mealie-list">🔄 Refrescar</button>
          </div>

          <div id="mealie-recipes-status" class="alert alert-secondary py-2 small mb-3">
            Conectando con Mealie...
          </div>

          <div id="mealie-recipes-container" class="list-group mb-3" style="max-height: 420px; overflow-y: auto;">
            <!-- Recetas de Mealie inyectadas vía JS -->
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <a href="#settings" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">⚙️ Ajustes de Mealie</a>
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Crear/Editar Receta -->
  <div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="recipeModalTitle">Nueva Receta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="recipe-form">
            <input type="hidden" id="recipe-id">
            
            <div class="row mb-3">
              <div class="col-md-8">
                <label for="recipe-name" class="form-label">Nombre de la receta</label>
                <input type="text" class="form-control" id="recipe-name" required>
              </div>
              <div class="col-md-4">
                <label for="recipe-servings" class="form-label">Raciones</label>
                <input type="number" class="form-control" id="recipe-servings" value="1" min="1" step="0.5" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Ingredientes</label>
              
              <!-- Buscador de productos para añadir ingrediente -->
              <div class="input-group mb-2">
                <input type="text" id="ingredient-search" class="form-control" placeholder="Código de barras o nombre...">
                <button class="btn btn-outline-secondary" type="button" id="btn-search-product">Buscar</button>
                <button class="btn btn-outline-secondary" type="button" id="btn-scan-product">Scan</button>
              </div>
              <div id="product-search-results" class="list-group mb-2" style="display:none; max-height: 150px; overflow-y: auto;"></div>

              <!-- Lista de ingredientes añadidos -->
              <ul class="list-group ingredient-list" id="ingredient-list">
                <!-- Se inyectan vía JS -->
              </ul>
            </div>

            <div class="mb-3">
              <label class="form-label">Nutrición (por ración)</label>
              <div id="nutrition-preview" class="p-2 border rounded">
                Añade ingredientes para calcular la nutrición.
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-save-recipe">Guardar Receta</button>
        </div>
      </div>
  <!-- Modal para Planificar / Añadir Receta a la Agenda -->
  <div class="modal fade" id="planRecipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="planRecipeModalTitle">📅 Añadir a la Agenda</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="plan-recipe-id">
          
          <div class="p-2 mb-3 rounded bg-dark border border-secondary d-flex justify-content-between align-items-center">
            <div>
              <strong id="plan-recipe-name" class="text-info">Receta</strong>
              <div id="plan-recipe-nutrition" class="small text-muted">0 kcal</div>
            </div>
            <span class="badge bg-primary" id="plan-recipe-servings-badge">1 ración</span>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Fecha</label>
            <input type="date" class="form-control mb-2" id="plan-date" required>
            <div class="d-flex gap-1">
              <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" id="btn-quick-date-today">Hoy</button>
              <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" id="btn-quick-date-tomorrow">Mañana</button>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="plan-meal-type" class="form-label small fw-bold">Momento</label>
              <select class="form-select" id="plan-meal-type">
                <option value="breakfast">Desayuno</option>
                <option value="midmorning">Almuerzo</option>
                <option value="lunch" selected>Comida</option>
                <option value="snack">Merienda</option>
                <option value="dinner">Cena</option>
              </select>
            </div>
            <div class="col-6">
              <label for="plan-course" class="form-label small fw-bold">Plato / Curso</label>
              <select class="form-select" id="plan-course">
                <option value="starter">🥗 Primero</option>
                <option value="main" selected>🍲 Principal</option>
                <option value="dessert">🍰 Postre</option>
                <option value="snack">🥪 Extra</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="plan-servings" class="form-label small fw-bold">Raciones a añadir</label>
            <input type="number" class="form-control" id="plan-servings" value="1" min="0.1" step="0.5">
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Estado del registro</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="planStatusRadio" id="planStatusPlanned" value="planned" checked>
                <label class="form-check-label small" for="planStatusPlanned">
                  ⏳ Planificado
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="planStatusRadio" id="planStatusConsumed" value="consumed">
                <label class="form-check-label small" for="planStatusConsumed">
                  ✓ Ya consumido
                </label>
              </div>
            </div>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="plan-deduct-pantry" checked>
            <label class="form-check-label small text-muted" for="plan-deduct-pantry">
              Descontar de despensa si es consumido
            </label>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary btn-sm" id="btn-do-plan-recipe">📅 Añadir a la Agenda</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/recipes.js"></script>
</body>
</html>
